<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>统一身份认证登录 - CAS</title>
</head>
<body>
<div id="loginForm" class="login-box">
  <h1>北京工业大学统一身份认证</h1>
  <div id="errorDiv" class="error-msg">用户名或密码错误，请重新输入</div>
  <form action="/cas/login" method="post">
    <input type="text" name="username" placeholder="学工号">
    <input type="password" name="password" placeholder="密码">
    <button type="submit">登录</button>
  </form>
</div>
</body>
</html>
