<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>WebVPN 网关登录</title>
</head>
<body>
<div class="gateway-login">
  <h1>北京工业大学 WebVPN</h1>
  <p>会话已过期，请重新登录网关</p>
  <form action="/login" method="post">
    <input type="text" name="user" placeholder="用户名">
    <input type="password" name="pwd" placeholder="密码">
    <button type="submit">登录</button>
  </form>
</div>
</body>
</html>
