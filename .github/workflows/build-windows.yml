name: Build Windows

# 仅构建 Windows 平台（暂不含 Android / macOS / Linux）。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Windows (NSIS + MSI)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (MSVC toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Ensure Windows bundlers (NSIS / WiX)
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          if (-not (Get-Command candle -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y --no-progress
          }

      - name: Install tauri-cli
        shell: pwsh
        run: cargo install tauri-cli --version "^2" --locked

      - name: Test Rust workspace
        shell: pwsh
        run: cargo test --workspace --locked

      - name: Build Windows bundles
        working-directory: apps/app
        shell: pwsh
        run: cargo tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: campus-notice-windows
          path: |
            **/target/release/bundle/nsis/*.exe
            **/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
