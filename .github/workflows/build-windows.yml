name: Build Windows

# 仅构建 Windows 平台（暂不含 Android / macOS / Linux）。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Windows (安装版 + 便携版)
    runs-on: windows-latest
    env:
      PRODUCT_VERSION: "0.0.1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (MSVC toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Ensure NSIS bundler
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }

      - name: Install tauri-cli
        shell: pwsh
        run: cargo install tauri-cli --version "^2" --locked

      - name: Test Rust workspace
        shell: pwsh
        run: cargo test --workspace --locked

      - name: Build Windows bundles
        working-directory: apps/app
        shell: pwsh
        run: cargo tauri build

      - name: Package portable executable
        shell: pwsh
        run: ./tools/pack-portable.ps1 -Out "target/release/bundle/portable/bjut-news-grabber-${{ env.PRODUCT_VERSION }}-portable.exe"

      - name: Normalize installer artifact name
        shell: pwsh
        run: |
          $nsis = Get-ChildItem -Path "target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nsis) {
            $nsis = Get-ChildItem -Path "apps/app/src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $nsis) { throw "NSIS installer not found" }
          $dest = Join-Path $nsis.DirectoryName "bjut-news-grabber-${{ env.PRODUCT_VERSION }}-installer.exe"
          Copy-Item -LiteralPath $nsis.FullName -Destination $dest -Force
          Write-Host "Installer: $dest"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: bjut-news-grabber-${{ env.PRODUCT_VERSION }}-installer
          path: |
            target/release/bundle/nsis/bjut-news-grabber-${{ env.PRODUCT_VERSION }}-installer.exe
            apps/app/src-tauri/target/release/bundle/nsis/bjut-news-grabber-${{ env.PRODUCT_VERSION }}-installer.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: bjut-news-grabber-${{ env.PRODUCT_VERSION }}-portable
          path: target/release/bundle/portable/bjut-news-grabber-${{ env.PRODUCT_VERSION }}-portable.exe
          if-no-files-found: error
          retention-days: 14
